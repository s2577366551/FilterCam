name: FilterCam
options:
  bundleIdPrefix: com.filtercam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  FilterCam:
    type: application
    platform: iOS
    sources:
      - path: FilterCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filtercam.app
        PRODUCT_NAME: FilterCam
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: FilterCam/Resources/Info.plist
      properties:
        CFBundleDisplayName: FilterCam
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: 用于拍摄带胶片滤镜的照片。
        NSPhotoLibraryAddUsageDescription: 用于将成片保存到相册。
  FilterCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FilterCamTests
    dependencies:
      - target: FilterCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filtercam.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FilterCam.app/FilterCam"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FilterCam:
    build:
      targets:
        FilterCam: all
        FilterCamTests: [test]
    test:
      targets:
        - FilterCamTests
